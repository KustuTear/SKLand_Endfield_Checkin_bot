<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SKLand Checkin Bot</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #1f2937;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, #dbeafe 0%, transparent 40%),
          linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      }

      main {
        width: min(680px, calc(100vw - 32px));
        padding: 32px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 16px;
        font-size: 32px;
      }

      p {
        margin: 0 0 12px;
        line-height: 1.6;
      }

      code {
        padding: 2px 6px;
        border-radius: 6px;
        background: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SKLand Checkin Bot</h1>
      <p>项目已部署，Telegram webhook 入口为 <code>/webhook</code>。</p>
      <p>这个页面只用于满足静态资源目录检测，并提供一个可访问的根路径。</p>
    </main>
  </body>
</html>
